<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promptify</title>
    <meta name="description" content="AI prompt engineering and challenge platform with real-time scoring, quizzes, and competitions." />
    <meta property="og:title" content="Promptify" />
    <meta property="og:description" content="AI prompt engineering and challenge platform with real-time scoring, quizzes, and competitions." />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Unregister any stale service workers (no PWA in this project)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(registration) {
            registration.unregister();
            console.log('[cleanup] Unregistered stale service worker:', registration.scope);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
